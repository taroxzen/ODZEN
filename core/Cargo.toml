[package]
name = "odzen-core"
version = "1.3.0"
edition = "2024"
authors = ["Taroxzen <https://github.com/taroxzen>"]
description = "Unified Rust Core Engine for ODZEN (Scanner, Artwork, Launcher, System)"
repository = "https://github.com/taroxzen/ODZEN"
license = "MIT"

[lib]
name = "odzen_core"
path = "src/lib.rs"

[[bin]]
name = "odzen-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
