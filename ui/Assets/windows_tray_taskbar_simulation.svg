<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Taskbar Gradient -->
    <linearGradient id="taskbarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b1015" stop-opacity="0.98" />
    </linearGradient>

    <!-- Wallpaper Gradient -->
    <radialGradient id="desktopBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="50%" stop-color="#041220" />
      <stop offset="100%" stop-color="#02080f" />
    </radialGradient>

    <!-- Logo Fluent Gradient -->
    <linearGradient id="logoLime" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#e6ff80" />
      <stop offset="35%" stop-color="#b4ff00" />
      <stop offset="75%" stop-color="#80d400" />
      <stop offset="100%" stop-color="#4e8000" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- REUSABLE ONYX LOGO COMPONENT -->
    <g id="onyxLogoCore">
      <!-- Glow -->
      <circle cx="256" cy="256" r="160" fill="#b4ff00" opacity="0.18" />
      <!-- O Ring -->
      <path d="M 256,66 A 190,190 0 1,0 446,256 A 190,190 0 0,0 256,66 Z M 256,156 A 100,100 0 1,1 156,256 A 100,100 0 0,1 256,156 Z" fill="url(#logoLime)" />
      <!-- Pixel D-Pad -->
      <g transform="translate(325, 95)">
        <path d="M 32,0 H 64 V 32 H 96 V 64 H 64 V 96 H 32 V 64 H 0 V 32 H 32 Z" fill="#000d1a" />
        <path d="M 35,3 H 61 V 35 H 93 V 61 H 61 V 93 H 35 V 61 H 3 V 35 H 35 Z" fill="#b4ff00" />
        <rect x="42" y="8" width="12" height="12" fill="#00233f" />
        <rect x="42" y="76" width="12" height="12" fill="#00233f" />
        <rect x="8" y="42" width="12" height="12" fill="#00233f" />
        <rect x="76" y="42" width="12" height="12" fill="#00233f" />
        <rect x="42" y="42" width="12" height="12" fill="#abe466" />
      </g>
      <!-- Dot -->
      <circle cx="415" cy="415" r="32" fill="url(#logoLime)" />
    </g>

    <!-- App Icon With Rounded Background -->
    <g id="onyxAppIcon">
      <rect width="512" height="512" rx="112" fill="#00233f" stroke="#00355c" stroke-width="4" />
      <use href="#onyxLogoCore" />
    </g>
  </defs>

  <!-- Masaüstü Arka Planı -->
  <rect width="1000" height="650" fill="url(#desktopBg)" />

  <!-- BAŞLIK & BİLGİ KUTULARI -->
  <text x="40" y="50" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Windows 11 Ortamında Logo ve Sistem İkonları Simülasyonu</text>
  <text x="40" y="75" fill="#8ca3ba" font-family="Segoe UI, sans-serif" font-size="13">Görev çubuğu, sistem tepsisi (tray) ve farklı piksel boyutlarındaki okunaklılık testleri</text>

  <!-- ==================== BÖLÜM 1: PİKSEL ÖLÇEK TESTLERİ (16px, 24px, 32px, 48px, 64px) ==================== -->
  <rect x="40" y="105" width="920" height="175" rx="12" fill="#0a1520" stroke="#1b2d42" stroke-width="1.5" />
  <text x="60" y="135" fill="#b4ff00" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">STANDART SİMGE ÖLÇEKLERİ (Icon Sizes Test)</text>

  <!-- 16x16 (Tray / Sekme / Küçük Liste) -->
  <g transform="translate(70, 160)">
    <rect x="-10" y="-10" width="100" height="100" rx="8" fill="#060d14" stroke="#122336" />
    <use href="#onyxLogoCore" transform="scale(0.03125) translate(400, 300)" />
    <!-- 16px Scale Representation (Scaled up for preview label) -->
    <use href="#onyxLogoCore" transform="translate(24, 10) scale(0.0625)" />
    <text x="40" y="65" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">16x16 px</text>
    <text x="40" y="80" fill="#6d849c" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">System Tray</text>
  </g>

  <!-- 24x24 (Kompakt Toolbar) -->
  <g transform="translate(190, 160)">
    <rect x="-10" y="-10" width="100" height="100" rx="8" fill="#060d14" stroke="#122336" />
    <use href="#onyxLogoCore" transform="translate(20, 4) scale(0.078)" />
    <text x="40" y="65" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">24x24 px</text>
    <text x="40" y="80" fill="#6d849c" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Menü / Bar</text>
  </g>

  <!-- 32x32 (Görev Çubuğu / Tray HD) -->
  <g transform="translate(310, 160)">
    <rect x="-10" y="-10" width="100" height="100" rx="8" fill="#060d14" stroke="#122336" />
    <use href="#onyxAppIcon" transform="translate(16, 2) scale(0.093)" />
    <text x="40" y="65" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">32x32 px</text>
    <text x="40" y="80" fill="#6d849c" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Tray 2X / List</text>
  </g>

  <!-- 48x48 (Görev Çubuğu Normal) -->
  <g transform="translate(430, 160)">
    <rect x="-10" y="-10" width="100" height="100" rx="8" fill="#060d14" stroke="#122336" />
    <use href="#onyxAppIcon" transform="translate(10, -5) scale(0.12)" />
    <text x="40" y="65" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">48x48 px</text>
    <text x="40" y="80" fill="#6d849c" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Taskbar App</text>
  </g>

  <!-- 64x64 (Masaüstü Kısayolu) -->
  <g transform="translate(550, 160)">
    <rect x="-10" y="-10" width="100" height="100" rx="8" fill="#060d14" stroke="#122336" />
    <use href="#onyxAppIcon" transform="translate(4, -8) scale(0.14)" />
    <text x="40" y="68" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">64x64 px</text>
    <text x="40" y="81" fill="#6d849c" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Desktop Icon</text>
  </g>

  <!-- 128x128 (Büyük / Splash / App Header) -->
  <g transform="translate(680, 140)">
    <rect x="0" y="0" width="260" height="120" rx="8" fill="#060d14" stroke="#122336" />
    <use href="#onyxAppIcon" transform="translate(20, 12) scale(0.187)" />
    <text x="130" y="45" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">ONYX Launcher</text>
    <text x="130" y="68" fill="#b4ff00" font-family="Segoe UI, sans-serif" font-size="12">128px HD Scale</text>
    <text x="130" y="88" fill="#6d849c" font-family="Segoe UI, sans-serif" font-size="11">Windows Store / Header</text>
  </g>

  <!-- ==================== BÖLÜM 2: GERÇEK WINDOWS 11 GÖREV ÇUBUĞU SİMÜLASYONU ==================== -->
  <!-- Masaüstü Penceresi Arka Planı -->
  <g transform="translate(40, 310)">
    <text x="0" y="-15" fill="#b4ff00" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">CANLI WINDOWS GÖREV ÇUBUĞU &amp; SAĞ ALT SİSTEM TEPSİSİ SİMÜLASYONU</text>

    <!-- Windows Taskbar Container -->
    <rect x="0" y="0" width="920" height="56" rx="8" fill="url(#taskbarBg)" stroke="#22303d" stroke-width="1" />

    <!-- 1. ORTA KISIM: WINDOWS 11 PINNED / RUNNING APPS -->
    <g transform="translate(340, 6)">
      <!-- Start Button -->
      <g transform="translate(0, 5)">
        <rect x="0" y="0" width="34" height="34" rx="4" fill="transparent" />
        <!-- Windows Icon -->
        <path d="M 10,10 H 16 V 16 H 10 Z M 18,10 H 24 V 16 H 18 Z M 10,18 H 16 V 24 H 10 Z M 18,18 H 24 V 24 H 18 Z" fill="#00adef" />
      </g>

      <!-- Search Button -->
      <g transform="translate(42, 5)">
        <circle cx="16" cy="16" r="6" stroke="#9bb1c9" stroke-width="1.8" fill="none" />
        <line x1="20.5" y1="20.5" x2="25" y2="25" stroke="#9bb1c9" stroke-width="1.8" stroke-linecap="round" />
      </g>

      <!-- File Explorer -->
      <g transform="translate(84, 5)">
        <rect x="5" y="7" width="24" height="20" rx="3" fill="#e5ad35" />
        <rect x="7" y="11" width="20" height="14" rx="2" fill="#3078c6" />
      </g>

      <!-- Edge Browser -->
      <g transform="translate(126, 5)">
        <circle cx="17" cy="17" r="11" fill="#0078d7" />
        <circle cx="19" cy="15" r="7" fill="#00c853" />
      </g>

      <!-- Steam / Game Store -->
      <g transform="translate(168, 5)">
        <circle cx="17" cy="17" r="11" fill="#171a21" stroke="#2a475e" />
        <circle cx="13" cy="20" r="3" fill="#ffffff" />
        <circle cx="21" cy="14" r="4" fill="#ffffff" />
      </g>

      <!-- ★ ONYX LAUNCHER APP ICON (ORTADA ÇALIŞAN UYGULAMA) ★ -->
      <g transform="translate(210, 5)">
        <!-- Aktif / Açık Uygulama Arka Plan Vurgusu -->
        <rect x="-2" y="-2" width="38" height="38" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
        
        <!-- App Icon -->
        <use href="#onyxAppIcon" transform="translate(2, 2) scale(0.0625)" />
        
        <!-- Aktif Gösterge Çizgisi (Active Running Pill Indicator) -->
        <rect x="10" y="36" width="14" height="3" rx="1.5" fill="#b4ff00" />
      </g>
    </g>

    <!-- 2. SAĞ ALT KISIM: SYSTEM TRAY (SİSTEM TEPSİSİ) -->
    <g transform="translate(680, 10)">
      <!-- Tray Chevron (Gizli Simgeleri Göster Oku) -->
      <path d="M 12,20 L 17,15 L 22,20" stroke="#9bb1c9" stroke-width="1.8" stroke-linecap="round" fill="none" />

      <!-- ★ ONYX SYSTEM TRAY ICON (Şeffaf Arka Planlı Lime O + D-Pad) ★ -->
      <g transform="translate(32, 2)">
        <!-- Tray Hover Box -->
        <rect x="-4" y="-2" width="32" height="32" rx="4" fill="#ffffff" fill-opacity="0.06" />
        <!-- Şeffaf 2D/3D Vektör İkon -->
        <use href="#onyxLogoCore" transform="translate(2, 4) scale(0.039)" />
      </g>

      <!-- Standart Windows Sistem Simgeleri (Karşılaştırma İçin) -->
      <!-- WiFi Icon -->
      <g transform="translate(74, 8)">
        <path d="M 2,16 A 14,14 0 0,1 18,16" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <path d="M 5,19 A 9,9 0 0,1 15,19" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <circle cx="10" cy="21" r="1.5" fill="#ffffff" />
      </g>

      <!-- Volume Icon -->
      <g transform="translate(100, 8)">
        <path d="M 2,10 L 6,10 L 11,6 L 11,20 L 6,16 L 2,16 Z" fill="#ffffff" />
        <path d="M 14,9 A 6,6 0 0,1 14,17" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
      </g>

      <!-- Battery / Power -->
      <g transform="translate(122, 10)">
        <rect x="0" y="3" width="16" height="9" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.2" />
        <rect x="2" y="5" width="9" height="5" fill="#ffffff" />
        <rect x="16" y="5.5" width="1.5" height="4" fill="#ffffff" />
      </g>

      <!-- Clock & Date -->
      <g transform="translate(155, 4)">
        <text x="40" y="12" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">14:05</text>
        <text x="40" y="24" fill="#9bb1c9" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="end">23.08.2026</text>
      </g>
    </g>
  </g>

  <!-- ==================== BÖLÜM 3: ÖZET DEĞERLENDİRME KUTUSU ==================== -->
  <g transform="translate(40, 420)">
    <rect width="920" height="190" rx="10" fill="#081018" stroke="#162536" stroke-width="1" />
    
    <text x="30" y="35" fill="#b4ff00" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Windows Görev Çubuğu &amp; Sistem Tepsisi Uyumluluk Analizi</text>
    
    <!-- Madde 1 -->
    <circle cx="40" cy="70" r="4" fill="#b4ff00" />
    <text x="55" y="74" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Sistem Tepsisi (16x16 / 24x24 px):</text>
    <text x="310" y="74" fill="#a0b5cb" font-family="Segoe UI, sans-serif" font-size="13">Piksel tabanlı D-pad ve kalın neon halka sayesinde diğer tek renkli Windows simgeleri (WiFi, Ses) yanında ışıldayarak anında fark edilir.</text>

    <!-- Madde 2 -->
    <circle cx="40" cy="105" r="4" fill="#b4ff00" />
    <text x="55" y="109" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Görev Çubuğu Rozeti (48x48 px):</text>
    <text x="310" y="109" fill="#a0b5cb" font-family="Segoe UI, sans-serif" font-size="13">Midnight koyu zemin kartı üzerinde parlayan yeşil halka, Windows 11'in koyu ve açık temalarında yüksek kontrast sunar.</text>

    <!-- Madde 3 -->
    <circle cx="40" cy="140" r="4" fill="#b4ff00" />
    <text x="55" y="144" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Masaüstü &amp; Başlat Menüsü (64 / 128 px):</text>
    <text x="310" y="144" fill="#a0b5cb" font-family="Segoe UI, sans-serif" font-size="13">Fluent 3D yumuşak gradyan derinliği ve Yettel estetiği büyük ölçekte modern, premium bir kurumsal oyun başlatıcı havası verir.</text>
  </g>
</svg>
